version: "3.9"

services:
  backend:
    build: .
    container_name: research-assistant-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    command: ["uvicorn", "backend.api:app", "--host", "0.0.0.0", "--port", "8000"]

  frontend:
    build: .
    container_name: research-assistant-frontend
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - BACKEND_URL=http://backend:8000
    volumes:
      - ./data:/app/data
    depends_on:
      - backend
    command: ["streamlit", "run", "app.py", "--server.address=0.0.0.0", "--server.port=8501"]
