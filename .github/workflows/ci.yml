name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests
        # No GOOGLE_API_KEY is set here on purpose: all Gemini API calls are
        # mocked in tests/test_rag.py and tests/test_api.py so CI never needs
        # a real secret and never spends real API credits.
        run: pytest -v --cov=backend --cov-report=term-missing
